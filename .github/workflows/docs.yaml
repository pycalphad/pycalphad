name: Documentation
# Builds on pushes to develop, all pull requests and published releases
# Deploys pushes to https://pycalphad.org/docs/latest/ and releases to https://pycalphad.org/docs/<tag>/
on:
  push:
    branches:
      - develop
  pull_request:  # all pull requests
  release:
    types: [published]

# Runs for the same branch or tag wait for each other, so docs are deployed in push order
concurrency: docs-${{ github.ref }}

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # fetch the entire repo history, required to guarantee setuptools_scm will pick up the tags
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: sudo wget https://github.com/jgm/pandoc/releases/download/2.18/pandoc-2.18-1-amd64.deb
      - run: sudo dpkg -i pandoc-2.18-1-amd64.deb
      - run: uv sync --dev
      # Executing the examples modifies tracked files, after which setuptools_scm would report a
      # development version (e.g. 0.12.1.dev0+g5326d9182.d20261103 for 0.12.0)
      - name: Pin the version of the clean checkout
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$(uv run python -c 'import pycalphad; print(pycalphad.__version__)')" >> "$GITHUB_ENV"
      - name: Update all examples
        run: bash tools/execute-all-example-notebooks.sh
      - run: uv run sphinx-build -W -b html docs docs/_build/html
      # Upload documentation html directory
      - uses: actions/upload-artifact@v7
        with:
          path: ./docs/_build/html
          name: pycalphad-documentation

  Deploy-Netlify:
    name: Deploy to Netlify
    needs: [Build]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pycalphad-documentation
          path: pycalphad-docs-html
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: 'pycalphad-docs-html'
          production-branch: develop
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

  Deploy:
    name: Deploy to pycalphad.org
    needs: [Build]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pycalphad-documentation
          path: pycalphad-docs-html
      # pycalphad.org serves this bucket through the pycalphad-docs Cloudflare Worker
      - name: Sync to the pycalphad-docs R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://a996c2a49c08d820d67284c0378ab316.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          DEPLOY_NAME: ${{ github.event_name == 'release' && github.ref_name || 'latest' }}
        # No --delete leaves orphaned pages, but prevents a sorting bug in R2 vs. S3 (gh-783)
        run: aws s3 sync pycalphad-docs-html "s3://pycalphad-docs/docs/$DEPLOY_NAME/"
